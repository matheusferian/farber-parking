<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#000000">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self'; connect-src https://sfewtirvqhrpanwhbchd.supabase.co http://127.0.0.1:8790 http://localhost:8790; base-uri 'none'; form-action 'none'">
<title>Watermakers Valet — Backup</title>
<link rel="icon" href="/favicon-32x32.png">
<style>
/* Watermakers staff phone — Apple-style (owner 2026-11-11): black, iOS grouped cards, system font,
   big touch targets for valets. Blue = action, red = car requested, green = ready. */
:root{--bg:#000;--p1:#1C1C1E;--p2:#2C2C2E;--line:rgba(84,84,88,.45);--tx:#F5F5F7;--mu:#8E8E93;--gold:#0A84FF;--gold2:#64D2FF;
  --park:#64D2FF;--req:#FF453A;--ret:#BF5AF2;--rdy:#30D158;--amb:#FFD60A;--bad:#FF453A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,select{font:inherit;color:inherit}
.hidden{display:none!important}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 16px;background:rgba(0,0,0,.82);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-bottom:.5px solid var(--line)}
.flag{height:3px;background:linear-gradient(90deg,#B3262E 0 33.3%,#FFFFFF 33.3% 66.6%,#0090D2 66.6%)}
.top .wml{height:22px;width:auto;flex:none}
.serif{font-family:inherit;font-weight:700;letter-spacing:-.025em}
.top .t{flex:1;min-width:0}.top b{display:block;font-size:17px;font-weight:600;letter-spacing:-.02em}.top small{display:block;color:var(--mu);font-size:12.5px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{width:40px;height:40px;border-radius:12px;background:var(--p2);border:0;font-size:24px;line-height:1;color:var(--gold)}
.net{font-size:11.5px;font-weight:600;padding:6px 10px;border-radius:999px;letter-spacing:.02em}
.net.on{background:rgba(48,209,88,.16);color:var(--rdy)}.net.off{background:rgba(255,214,10,.16);color:var(--amb)}
.offbar{background:var(--amb);color:#1a1400;font-weight:600;font-size:14px;padding:10px 16px}
.reqbar{display:block;width:100%;border:0;text-align:left;background:var(--req);color:#fff;padding:13px 16px;font-weight:600;font-size:15.5px;letter-spacing:-.01em}
.body{padding:16px 16px 120px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--p1);border-radius:14px;padding:12px 6px;text-align:center}
.stat b{display:block;font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.stat small{font-size:12px;color:var(--mu);font-weight:500}
.tile{display:flex;align-items:center;gap:14px;width:100%;min-height:76px;margin-top:10px;padding:0 18px;border-radius:18px;background:var(--p1);border:0;font-weight:600;font-size:19px;letter-spacing:-.02em;text-align:left}
.tile.primary{background:var(--gold);color:#fff;min-height:96px;font-size:22px}
.tile:disabled{opacity:.35}
.tile .cnt{margin-left:auto;min-width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--p2);font-variant-numeric:tabular-nums}
.tile .cnt.hot{background:var(--req);color:#fff}
.note{color:var(--amb);font-size:14px;font-weight:500;margin-top:8px}
.lab{display:block;font-size:13px;font-weight:500;color:var(--mu);margin:20px 0 8px 4px}
.field{width:100%;min-height:56px;padding:10px 16px;font-size:21px;font-weight:500;background:var(--p1);border:0;border-radius:14px;outline:none;box-shadow:inset 0 0 0 1px var(--line)}
.field:focus{box-shadow:inset 0 0 0 2px var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 15px;border-radius:12px;background:var(--p1);border:0;font-weight:500;font-size:15.5px}
.chip.on{background:#fff;color:#000}
.locs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.loc{min-height:64px;border-radius:14px;background:var(--p1);border:0;font-weight:600;font-size:17px}
.loc.on{background:#fff;color:#000}
.big{display:block;width:100%;min-height:58px;margin-top:12px;border:0;border-radius:14px;font-weight:600;font-size:18px;letter-spacing:-.015em}
.big.gold{background:var(--gold);color:#fff}.big.green{background:var(--rdy);color:#00230b}.big.red{background:var(--req);color:#fff}
.big.violet{background:var(--ret);color:#fff}.big.dark{background:var(--p2)}
.big:disabled{opacity:.35}
.foot{position:fixed;left:0;right:0;bottom:0;padding:10px 16px max(14px,env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 78%,transparent)}
.hook{text-align:center;padding:22px 10px 26px;border-radius:22px;background:var(--p1);margin-top:8px}
.hook small{font-weight:500;font-size:14px;color:var(--mu)}.hook .n{font-size:128px;font-weight:700;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.hook p{margin:0;font-size:18px;font-weight:500;color:var(--tx)}
.vc{display:flex;gap:12px;padding:12px;border-radius:18px;background:var(--p1);margin-top:10px}
.vc.REQUESTED{box-shadow:inset 0 0 0 2px var(--req)}
.vc .hn{flex:none;width:64px;border-radius:12px;background:var(--p2);display:flex;flex-direction:column;align-items:center;justify-content:center}
.vc .hn small{font-size:11px;color:var(--mu);font-weight:500}.vc .hn b{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.vc .i{flex:1;min-width:0}.vc .nm{font-size:17px;font-weight:600;letter-spacing:-.015em}.vc .meta{font-size:14px;color:var(--mu);margin-top:3px}
.pill{display:inline-block;margin-top:7px;font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px}
.pill.PARKED{background:rgba(100,210,255,.15);color:var(--park)}.pill.REQUESTED{background:rgba(255,69,58,.2);color:#FF8A82}
.pill.RETRIEVING{background:rgba(191,90,242,.18);color:#D9A6F7}.pill.READY{background:rgba(48,209,88,.16);color:var(--rdy)}
.pill.DELIVERED{background:rgba(142,142,147,.16);color:var(--mu)}
.vc .act{margin-top:9px;width:100%;min-height:46px;border:0;border-radius:12px;font-weight:600;font-size:15.5px}
.amts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.amt{min-height:58px;border-radius:14px;background:var(--p1);border:0;font-size:20px;font-weight:600}
.amt.on{background:#fff;color:#000}
.toast{position:fixed;left:14px;right:14px;bottom:96px;z-index:20;padding:14px 16px;border-radius:14px;background:#fff;color:#000;font-weight:600;font-size:15px}
.toast.warn{background:var(--amb)}.toast.bad{background:var(--req);color:#fff}
.empty{color:var(--mu);text-align:center;padding:30px 0}
.center{text-align:center}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0 4px}
.ht{position:relative;height:60px;border-radius:12px;background:var(--p2);color:#fff;border:0;font-weight:700;font-size:23px;font-variant-numeric:tabular-nums;overflow:hidden;padding:0 0 6px}
.ht.REQUESTED{background:#8E2442}.ht.RETRIEVING{background:#0A84FF}.ht.READY{background:#F2C230;color:#111}
.ht i{position:absolute;left:0;right:0;bottom:0;height:5px;background:#FF9F0A}.ht i.FRONT{background:#64D2FF}.ht i.SIDE{background:#30D158}.ht i.BACK{background:#BF5AF2}
.ht .dot{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:#FF8A1F}
.big.amber{background:#FF9F0A;color:#1a1000}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast hidden"></div>
<script>
'use strict';
// Watermakers Valet — BACKUP phone page (the S710 is the main device).
// Auth = the individual link (#k=<token>) + a device session (employee name once).
// Phone hooks are 41–50 only; check-in needs internet (the S710 is the only offline allocator).
var API = 'https://sfewtirvqhrpanwhbchd.supabase.co/functions/v1/event-valet/staff';
if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) API = 'http://127.0.0.1:8790/event-valet/staff';
var COLORS = ['Black', 'White', 'Silver', 'Gray', 'Blue', 'Red', 'Other'];
var MAKES = ['Toyota', 'Honda', 'Tesla', 'BMW', 'Mercedes', 'Lexus', 'Ford', 'Jeep', 'Chevy', 'Nissan'];
function ls(k, v){ try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
// the token leaves the address bar right away (screenshots / shoulder surfing)
var m = (location.hash || '').match(/k=([A-Za-z0-9_-]{43})/);
if (m) { if (ls('wm_k') !== m[1]) { ls('wm_k', m[1]); ls('wm_s', null); } history.replaceState(null, '', location.pathname); }
var KEY = ls('wm_k'), SESSION = ls('wm_s');
var S = { view: 'home', st: null, online: true, draft: null, hook: null, ck: null, tip: null, q: '', results: null, busy: false };

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function pad2(n){ return ('0' + n).slice(-2); }
function fmtPhone(d){ d = String(d || '').replace(/\D/g, '').slice(0, 10); if (d.length < 4) return d; if (d.length < 7) return '(' + d.slice(0, 3) + ') ' + d.slice(3); return '(' + d.slice(0, 3) + ') ' + d.slice(3, 6) + '-' + d.slice(6); }
function mins(iso){ return iso ? Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000)) : 0; }
function toast(msg, kind){ var t = $('toast'); t.className = 'toast' + (kind ? ' ' + kind : ''); t.textContent = msg; clearTimeout(toast.t); toast.t = setTimeout(function(){ t.className = 'toast hidden'; }, 3200); }
function uid(){ return 'web-' + (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()); }

async function api(method, op, body){
  var h = { 'x-ev-key': KEY || '', 'content-type': 'application/json' };
  if (SESSION) h['x-ev-session'] = SESSION;
  var url = API + '/' + op + (method === 'GET' && body ? '?' + new URLSearchParams(body) : '');
  var c = new AbortController(); var to = setTimeout(function(){ c.abort(); }, 10000);
  try {
    var r = await fetch(url, { method: method, headers: h, body: method === 'POST' ? JSON.stringify(body || {}) : undefined, signal: c.signal, cache: 'no-store' });
    var j = await r.json().catch(function(){ return {}; });
    setOnline(true);
    if (!r.ok) { j.httpStatus = r.status; if (j.error === 'AUTH' && SESSION && /session/.test(JSON.stringify(j))) { ls('wm_s', null); SESSION = null; } throw j; }
    return j;
  } catch (e) {
    if (e && e.error) throw e;
    setOnline(false);
    throw { error: 'OFFLINE', message: 'No internet. Try again.' };
  } finally { clearTimeout(to); }
}
function setOnline(on){ if (S.online !== on) { S.online = on; render(); } }
window.addEventListener('online', function(){ refresh(); });
window.addEventListener('offline', function(){ setOnline(false); });

async function refresh(){
  if (!KEY || !SESSION) return;
  try { S.st = await api('GET', 'state'); if (S.view === 'home' || S.view === 'cars') render(); }
  catch (e) { if (e.error && e.error !== 'OFFLINE') { S.fatal = e; render(); } }
}
setInterval(function(){ if (!document.hidden) refresh(); }, 4000);

// ── screens ──
function topbar(title, sub, back){
  var on = S.online;
  var rq = S.st ? S.st.tickets.filter(function(t){ return t.status === 'REQUESTED'; }) : [];
  return '<div class="flag"></div><div class="top">' + (back ? '<button class="back" data-a="home">‹</button>' : '<img class="wml" src="watermakers-logo-reverse.png" alt="Watermakers">') +
    '<div class="t"><b>' + title + '</b><small>' + (sub || 'Farber Parking · backup phone') + '</small></div>' +
    '<span class="net ' + (on ? 'on' : 'off') + '">' + (on ? 'Online' : 'Offline') + '</span></div>' +
    (on ? '' : '<div class="offbar">No internet. Check in cars on the S710.</div>') +
    (rq.length && S.view !== 'cars' ? '<button class="reqbar" data-a="cars">Car requested · hook ' + pad2(rq[0].hook) + ' · ' + rq.length + ' waiting</button>' : '');
}
var R = {};
R.blocked = function(e){
  return '<div class="flag"></div><div class="body center" style="padding-top:40px"><img src="watermakers-logo-reverse.png" alt="Watermakers" style="display:block;width:180px;margin:0 auto 18px"><h2>' + esc(e.message || 'This link is not valid.') + '</h2>' +
    '<p style="color:#8E8E93">Watermakers Valet · Farber Parking</p></div>';
};
R.name = function(){
  return '<div class="flag"></div><div class="body" style="padding-top:28px"><img src="watermakers-logo-reverse.png" alt="Watermakers" style="display:block;width:210px;margin:0 auto 10px">' +
    '<h2 class="center serif" style="font-size:30px;margin:10px 0 4px">Thank you, veterans.</h2><p class="center" style="color:#8E8E93;margin:0;font-size:15px">Valet staff · backup phone</p>' +
    '<img src="farber-parking-crest.png" alt="Farber Parking" style="display:block;width:96px;margin:18px auto 0">' +
    '<label class="lab" for="nm">Your name</label><input id="nm" class="field" autocomplete="off" autocapitalize="words" placeholder="First name">' +
    '<button class="big gold" data-a="start">Start shift</button></div>';
};
R.home = function(){
  var c = S.st ? S.st.counts : { active: 0, requested: 0, hooksFree: 0 };
  return topbar('Watermakers Valet', S.st ? 'Shift: ' + esc(S.st.me.employeeName) + ' · ' + esc(S.st.me.label) : '') + '<div class="body">' +
    '<div class="stats"><div class="stat"><b>' + c.active + '</b><small>Cars</small></div><div class="stat"><b style="color:#FF9AA0">' + c.requested + '</b><small>Requests</small></div><div class="stat"><b>' + c.hooksFree + '</b><small>Hooks free</small></div></div>' +
    '<button class="tile primary" data-a="checkin"' + (S.online ? '' : ' disabled') + '>＋ Check in car</button>' +
    (S.online ? '' : '<div class="note">No internet. Check in cars on the S710.</div>') +
    '<button class="tile" data-a="cars">Get car<span class="cnt' + (c.requested ? ' hot' : '') + '">' + c.requested + '</span></button>' +
    '<button class="tile" data-a="search">Search</button>' +
    '<button class="tile" data-a="tip">Record cash tip</button>' +
    '<p style="color:#8E8E93;font-size:13px;margin-top:18px">Card tips are taken on the S710.</p></div>';
};
R.checkin = function(){
  var d = S.draft;
  var ok = d.phone.length === 10 && ((d.mode === 'make' && d.make) || (d.mode === 'plate' && d.plate.trim().length >= 2)) && d.loc;
  return topbar('Check in car', 'Phone, car and spot', true) + '<div class="body">' +
    '<label class="lab" for="ph">Customer phone</label><input id="ph" class="field" type="tel" inputmode="numeric" placeholder="(954) 555-0000" value="' + esc(fmtPhone(d.phone)) + '">' +
    '<label class="lab">Car</label><div class="chips">' +
      '<button class="chip' + (d.mode === 'make' ? ' on' : '') + '" data-a="mode" data-v="make">Color + make</button>' +
      '<button class="chip' + (d.mode === 'plate' ? ' on' : '') + '" data-a="mode" data-v="plate">License plate</button></div>' +
    (d.mode === 'make'
      ? '<div class="chips" style="margin-top:10px">' + COLORS.map(function(x){ return '<button class="chip' + (d.color === x ? ' on' : '') + '" data-a="color" data-v="' + x + '">' + x + '</button>'; }).join('') + '</div>' +
        '<div class="chips" style="margin-top:10px">' + MAKES.map(function(x){ return '<button class="chip' + (d.make === x ? ' on' : '') + '" data-a="make" data-v="' + x + '">' + x + '</button>'; }).join('') + '</div>' +
        '<input id="mk" class="field" style="margin-top:10px;font-size:18px" placeholder="Other make / model (optional)" value="' + esc(d.model) + '">'
      : '<input id="pl" class="field" style="margin-top:10px;text-transform:uppercase" placeholder="ABC 1234" value="' + esc(d.plate) + '">') +
    '<label class="lab">Parked at</label><div class="locs">' + ['FRONT', 'SIDE', 'BACK'].map(function(x){ return '<button class="loc' + (d.loc === x ? ' on' : '') + '" data-a="loc" data-v="' + x + '">' + x + '</button>'; }).join('') + '</div>' +
    '</div><div class="foot"><button class="big amber" data-a="quick" id="quickBtn"' + (d.phone.length === 10 && S.online && !S.busy ? '' : ' disabled') + ' style="margin-bottom:10px">Send text now — car later</button><button class="big gold" data-a="assign"' + (ok && S.online && !S.busy ? '' : ' disabled') + ' id="assign">Assign key hook</button></div>';
};
R.hook = function(){
  return topbar('Key hook', 'Put the key on the hook, then confirm', true) + '<div class="body">' +
    '<div class="hook"><small>Hook</small><div class="n">' + pad2(S.hook) + '</div><p>Put the key on hook ' + pad2(S.hook) + '</p></div>' +
    '<button class="big dark" data-a="otherHook">Use another hook</button></div>' +
    '<div class="foot"><button class="big green" data-a="confirm"' + (S.busy ? ' disabled' : '') + '>Key stored</button></div>';
};
function card(t){
  var mine = S.st && t.retrievingBy && t.retrievingBy === S.st.me.employeeName;
  var act = t.status === 'PARKED' || t.status === 'REQUESTED' ? '<button class="act" style="background:var(--req);color:#fff" data-a="st" data-id="' + t.id + '" data-to="RETRIEVING">Get car</button>'
    : t.status === 'RETRIEVING' ? (mine ? '<button class="act" style="background:var(--gold);color:#fff" data-a="st" data-id="' + t.id + '" data-to="READY">Car ready</button>' : '<div class="meta">' + esc(t.retrievingBy) + ' is getting this car</div>')
    : t.status === 'READY' ? '<button class="act" style="background:var(--rdy);color:#03200f" data-a="st" data-id="' + t.id + '" data-to="DELIVERED">Delivered</button>' : '';
  var wait = t.status === 'REQUESTED' ? ' · waiting ' + mins(t.requestedAt) + ' min' : '';
  return '<div class="vc ' + t.status + '"><div class="hn"><small>Hook</small><b>' + (t.status === 'DELIVERED' ? '—' : pad2(t.hook)) + '</b></div><div class="i">' +
    '<div class="nm">' + esc(t.vehicleText) + '</div><div class="meta">' + (t.location ? esc(t.location) : '<span style="color:#FF9F0A">Spot not set</span>') + ' · ••' + esc(t.phoneLast4) + wait + '</div>' +
    '<span class="pill ' + t.status + '">' + ({ PARKED: 'Parked', REQUESTED: 'Requested', RETRIEVING: 'On the way', READY: 'Ready', DELIVERED: 'Delivered' }[t.status] || t.status) + (t.retrievingBy && t.status !== 'DELIVERED' && t.status !== 'PARKED' ? ' · ' + esc(t.retrievingBy) : '') + '</span>' + act + (t.status !== 'DELIVERED' ? '<button class="act" style="background:' + (needs(t) ? '#FF9F0A;color:#1a1000' : 'var(--p2);color:#fff') + '" data-a="edit" data-id="' + t.id + '">' + (needs(t) ? 'Add car + spot' : 'Edit car / spot') + '</button>' : '') + '</div></div>';
}
function needs(t){ var v = t.vehicle || {}; return !t.location || (!v.color && !v.make && !v.plate); }
var ORD = { REQUESTED: 0, RETRIEVING: 1, READY: 2, PARKED: 3, DELIVERED: 4 };
function sorted(list){ return list.slice().sort(function(a, b){ return ORD[a.status] - ORD[b.status] || (a.status === 'REQUESTED' ? new Date(a.requestedAt) - new Date(b.requestedAt) : (a.hook || 99) - (b.hook || 99)); }); }
R.cars = function(){
  var all = S.st ? S.st.tickets.filter(function(t){ return t.status !== 'DELIVERED'; }) : [];
  var f = S.filter || 'all';
  var shown = all.filter(function(t){ return f === 'req' ? t.status !== 'PARKED' : f === 'need' ? needs(t) : true; });
  var tiles = shown.slice().sort(function(a, b){ return (a.hook || 99) - (b.hook || 99); }).map(function(t){
    return '<button class="ht ' + t.status + '" data-a="pick" data-id="' + t.id + '">' + pad2(t.hook) + (needs(t) ? '<span class="dot"></span>' : '') + '<i class="' + (t.location || '') + '"></i></button>'; }).join('');
  var picked = S.pick && all.filter(function(t){ return t.id === S.pick; })[0];
  var list = picked ? [picked] : sorted(shown.filter(function(t){ return t.status !== 'PARKED'; }));
  return topbar('Get car', 'Tap a hook to see the car', true) + '<div class="body">' +
    '<div class="chips">' + [['all', 'All ' + all.length], ['req', 'Requested'], ['need', 'Need info']].map(function(x){ return '<button class="chip' + (f === x[0] ? ' on' : '') + '" data-a="filter" data-v="' + x[0] + '">' + x[1] + '</button>'; }).join('') + '</div>' +
    (tiles ? '<div class="board">' + tiles + '</div>' : '<div class="empty">No cars right now.</div>') +
    list.map(card).join('') + '</div>';
};
R.edit = function(){
  var d = S.draft, t = S.st && S.st.tickets.filter(function(x){ return x.id === S.editId; })[0];
  if (!t) return topbar('Car', '', true) + '<div class="body"><div class="empty">Car not found.</div></div>';
  return topbar('Key on hook ' + pad2(t.hook), 'Add car + spot now, or tap ‹ to do it later', true) + '<div class="body">' +
    '<label class="lab">Color</label><div class="chips">' + COLORS.map(function(x){ return '<button class="chip' + (d.color === x ? ' on' : '') + '" data-a="color" data-v="' + x + '">' + x + '</button>'; }).join('') + '</div>' +
    '<label class="lab">Make</label><div class="chips">' + MAKES.map(function(x){ return '<button class="chip' + (d.make === x ? ' on' : '') + '" data-a="make" data-v="' + x + '">' + x + '</button>'; }).join('') + '</div>' +
    '<label class="lab">Parked at</label><div class="locs">' + ['FRONT', 'SIDE', 'BACK'].map(function(x){ return '<button class="loc' + (d.loc === x ? ' on' : '') + '" data-a="loc" data-v="' + x + '">' + x + '</button>'; }).join('') + '</div>' +
    '</div><div class="foot"><button class="big gold" data-a="saveEdit"' + ((d.make || d.loc) && !S.busy ? '' : ' disabled') + '>Save</button></div>';
};
R.search = function(){
  return topbar('Search', 'Phone, plate, car or hook #', true) + '<div class="body"><input id="q" class="field" placeholder="Phone, plate, car or hook #" value="' + esc(S.q) + '" autocomplete="off">' +
    '<button class="big dark" data-a="doSearch">Search</button>' +
    (S.results ? (S.results.length ? sorted(S.results).map(card).join('') : '<div class="empty">No car found.</div>') : '') + '</div>';
};
R.tip = function(){
  var t = S.tip, cars = S.st ? sorted(S.st.tickets) : [];
  return topbar('Record cash tip', 'Cash only. Card tips are on the S710.', true) + '<div class="body">' +
    '<label class="lab">Amount</label><div class="amts">' + [5, 10, 20, 40].map(function(a){ return '<button class="amt' + (t.cents === a * 100 ? ' on' : '') + '" data-a="amt" data-v="' + a * 100 + '">$' + a + '</button>'; }).join('') + '</div>' +
    '<input id="oth" class="field" style="margin-top:10px" type="number" inputmode="numeric" placeholder="Other amount ($)" value="' + (t.other || '') + '">' +
    '<label class="lab">Car (optional)</label><select id="car" class="field" style="font-size:17px"><option value="">No car — event tip</option>' +
      cars.map(function(c){ return '<option value="' + c.id + '"' + (t.ticketId === c.id ? ' selected' : '') + '>Hook ' + pad2(c.hook) + ' · ' + esc(c.vehicleText) + ' · ' + c.status + '</option>'; }).join('') + '</select>' +
    '</div><div class="foot"><button class="big green" data-a="recordCash"' + (t.cents >= 100 && !S.busy ? '' : ' disabled') + '>Record $' + ((t.cents || 0) / 100) + ' cash</button></div>';
};
function render(){
  var a = $('app');
  if (!KEY) { a.innerHTML = R.blocked({ message: 'Open the staff link your supervisor sent you.' }); return; }
  if (S.fatal) { a.innerHTML = R.blocked(S.fatal); return; }
  if (!SESSION) { a.innerHTML = R.name(); return; }
  a.innerHTML = (R[S.view] || R.home)();
}

// ── actions ──
function go(v){ S.view = v; render(); scrollTo(0, 0); }
function fail(e){ toast(e.message || 'Something went wrong. Try again.', e.error === 'OFFLINE' ? 'warn' : 'bad'); }
document.addEventListener('input', function(e){
  var d = S.draft;
  if (e.target.id === 'ph') { d.phone = e.target.value.replace(/\D/g, '').slice(0, 10); e.target.value = fmtPhone(d.phone); }
  else if (e.target.id === 'pl') d.plate = e.target.value;
  else if (e.target.id === 'mk') d.model = e.target.value;
  else if (e.target.id === 'q') { S.q = e.target.value; return; }
  else if (e.target.id === 'oth') { S.tip.other = e.target.value; S.tip.cents = Math.round(parseFloat(e.target.value || '0') * 100) || 0; var b = document.querySelector('[data-a=recordCash]'); if (b) { b.disabled = S.tip.cents < 100; b.textContent = 'Record $' + S.tip.cents / 100 + ' cash'; } return; }
  else return;
  if (S.view === 'checkin') { var ok = d.phone.length === 10 && ((d.mode === 'make' && d.make) || (d.mode === 'plate' && d.plate.trim().length >= 2)) && d.loc; $('assign').disabled = !(ok && S.online); $('quickBtn').disabled = !(d.phone.length === 10 && S.online); }
});
document.addEventListener('change', function(e){ if (e.target.id === 'car') S.tip.ticketId = e.target.value || null; });
document.addEventListener('click', async function(e){
  var b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
  var a = b.getAttribute('data-a'), v = b.getAttribute('data-v'), d = S.draft;
  try {
    if (a === 'home') { S.draft = null; S.hook = null; go('home'); }
    else if (a === 'start') {
      var n = ($('nm').value || '').trim(); if (n.length < 2) return toast('Type your name (2 letters or more)', 'warn');
      var s = await api('POST', 'session', { name: n }); SESSION = s.sessionId; ls('wm_s', SESSION); await refresh(); go('home');
    }
    else if (a === 'checkin') { S.draft = { phone: '', mode: 'make', color: '', make: '', model: '', plate: '', loc: '' }; S.ck = uid(); go('checkin'); }
    else if (a === 'mode') { d.mode = v; render(); }
    else if (a === 'color') { d.color = v; render(); }
    else if (a === 'make') { d.make = v; render(); }
    else if (a === 'loc') { d.loc = v; render(); }
    else if (a === 'quick') {
      S.busy = true; render();
      var qh = await api('POST', 'hold', { clientKey: S.ck });
      var qr = await api('POST', 'checkin', { clientKey: S.ck, phone: d.phone, vehicle: {}, quick: true, hook: qh.hook, keyStoredAt: new Date().toISOString() });
      S.busy = false; toast('Text sent · put key on hook ' + pad2(qr.ticket.hook));
      await refresh();
      S.editId = qr.ticket.id; S.draft = { phone: '', mode: 'make', color: '', make: '', model: '', plate: '', loc: '' };
      go('edit');
    }
    else if (a === 'assign') { d.quick = false; S.busy = true; render(); var hres = await api('POST', 'hold', { clientKey: S.ck }); S.busy = false; S.hook = hres.hook; go('hook'); }
    else if (a === 'otherHook') {
      var x = prompt('Hook number (01–50):'); if (!x) return;
      if (!/^\d{1,2}$/.test(x.trim())) return toast('Choose a hook number', 'warn');
      S.hook = parseInt(x, 10); render();
    }
    else if (a === 'confirm') {
      S.busy = true; render();
      var veh = d.quick ? {} : d.mode === 'make' ? { color: d.color === 'Other' ? '' : d.color, make: d.make, model: d.model } : { plate: d.plate };
      var body = { clientKey: S.ck, phone: d.phone, vehicle: veh, hook: S.hook, keyStoredAt: new Date().toISOString() };
      if (d.quick) body.quick = true; else body.location = d.loc;
      var r = await api('POST', 'checkin', body);
      S.busy = false; S.draft = null;
      toast('Checked in · hook ' + pad2(r.ticket.hook) + (r.sms && r.sms.welcome === 'SENT' ? ' · text sent' : ''));
      await refresh(); go('home');
    }
    else if (a === 'cars') { S.pick = null; go('cars'); }
    else if (a === 'filter') { S.filter = v; S.pick = null; render(); }
    else if (a === 'pick') { var pid = b.getAttribute('data-id'); S.pick = S.pick === pid ? null : pid; render(); }
    else if (a === 'edit') {
      var et = S.st.tickets.filter(function(x){ return x.id === b.getAttribute('data-id'); })[0]; if (!et) return;
      var ev = et.vehicle || {};
      S.editId = et.id; S.draft = { phone: '', mode: 'make', color: ev.color ? ev.color.charAt(0) + ev.color.slice(1).toLowerCase() : '', make: ev.make ? ev.make.charAt(0) + ev.make.slice(1).toLowerCase() : '', model: '', plate: '', loc: et.location || '' };
      go('edit');
    }
    else if (a === 'saveEdit') {
      S.busy = true; render();
      var eb = { clientKey: uid(), ticketId: S.editId };
      if (d.make) eb.vehicle = { color: d.color === 'Other' ? '' : d.color, make: d.make };
      if (d.loc) eb.location = d.loc;
      await api('POST', 'edit', eb);
      S.busy = false; S.draft = null; toast('Car saved'); await refresh(); S.pick = S.editId; go('cars');
    }
    else if (a === 'search') { S.results = null; go('search'); setTimeout(function(){ var q = $('q'); if (q) q.focus(); }, 50); }
    else if (a === 'doSearch') { var sr = await api('GET', 'search', { q: S.q }); S.results = sr.tickets; render(); }
    else if (a === 'st') {
      if (b.getAttribute('data-to') === 'DELIVERED' && !confirm('Before Delivered: tag removed from the CAR and from the KEY?')) return;
      b.disabled = true;
      var r2 = await api('POST', 'status', { clientKey: uid(), ticketId: b.getAttribute('data-id'), to: b.getAttribute('data-to') });
      toast({ RETRIEVING: 'Go get hook ' + pad2(r2.ticket.hook), READY: 'Car ready · hook ' + pad2(r2.ticket.hook), DELIVERED: 'Delivered · hook ' + pad2(r2.ticket.hook) + ' is free' }[r2.ticket.status] || 'DONE');
      await refresh(); if (S.view === 'search') { S.results = null; go('cars'); } else render();
    }
    else if (a === 'tip') { S.tip = { cents: 0, other: '', ticketId: null, ck: uid(), dupOk: false }; go('tip'); }
    else if (a === 'amt') { S.tip.cents = parseInt(v, 10); S.tip.other = ''; render(); }
    else if (a === 'recordCash') {
      S.busy = true; render();
      try {
        await api('POST', 'cash-tip', { clientKey: S.tip.ck, amountCents: S.tip.cents, ticketId: S.tip.ticketId || undefined, confirmDuplicate: S.tip.dupOk || undefined });
      } catch (err) {
        S.busy = false;
        if (err.error === 'DUPLICATE_CASH' && confirm('This cash tip was already recorded by ' + (err.existing && err.existing.employeeName || 'someone') + '. Is this a SECOND tip?')) {
          S.tip.dupOk = true; S.tip.ck = uid(); render(); return document.querySelector('[data-a=recordCash]').click();
        }
        render(); throw err;
      }
      S.busy = false; toast('$' + S.tip.cents / 100 + ' cash recorded'); go('home');
    }
  } catch (err) { S.busy = false; if (S.view !== 'home') render(); fail(err); }
});
render();
if (KEY && SESSION) refresh().then(render);
</script>
</body>
</html>
