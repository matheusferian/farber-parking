<title>Makers Air Valet</title>
<!-- Makers Air Valet passenger portal: https://airvalet.farberos.com/a#<token>
     (vercel.json rewrites /a → this file). The token is in the #fragment:
     browsers never send it to a server, log or Referer. This page does NOT
     validate it — it posts it to valet-pass, which alone decides ok /
     expired / limited. No login, no cookies, no third-party scripts or fonts
     (Sora / Inter are self-hosted in assets/fonts).
     Shows the guest's own ticket number (small, for reference); never the
     phone or where a key is.
     Concept C (approved 2026-10-11): the hero and its Grand Caravan flight are
     static markup here, outside #app, so the 30 s refresh never replays them. -->
<link rel="preload" href="assets/fonts/sora-latin-v17.woff2" as="font" type="font/woff2" crossorigin>
