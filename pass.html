<!-- Makers Air Valet passenger portal: https://airvalet.farberos.com/a#<token>
     (vercel.json rewrites /a → this file). The token is in the #fragment:
     browsers never send it to a server, log or Referer. This page does NOT
     validate it — it posts it to valet-pass, which alone decides ok /
     expired / limited. No login, no cookies, no third-party scripts.
     Shows the guest's own ticket number (small, for reference); never the
     phone or where a key is. -->
